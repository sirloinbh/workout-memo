name: Verify application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: workout, POSTGRES_PASSWORD: test, POSTGRES_DB: workout }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run db:migrate
        env: { DATABASE_URL: 'postgres://workout:test@localhost:5432/workout' }
      - run: npm run check
        env: { TEST_DATABASE_URL: 'postgres://workout:test@localhost:5432/workout' }

  # Workout CRUD in a real browser against the API and a migrated PostgreSQL.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: workout, POSTGRES_PASSWORD: test, POSTGRES_DB: workout }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run db:migrate
        env: { DATABASE_URL: 'postgres://workout:test@localhost:5432/workout' }
      # ubuntu-latest ships Google Chrome; Playwright uses it via channel 'chrome'.
      - run: npm run test:e2e
        env: { E2E_DATABASE_URL: 'postgres://workout:test@localhost:5432/workout' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  # Lightsail deployment code (#73): format and provider schema validation, no AWS access.
  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infrastructure } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: bash -n user-data.sh && for f in ../deploy/*.sh; do bash -n "$f"; done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t workout-frontend:ci ./frontend
      - run: docker build -t workout-backend:ci ./backend
