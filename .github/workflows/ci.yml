# Managed file. Edit it in sirloinbh/project-standards .github/workflows/
# A public repo cannot call a reusable workflow of the private central repo, so the central reusable-app-ci.yml is expanded here with the values of this repo (#209).
name: ci

on: [push, pull_request]

permissions:
  contents: read
  packages: read # install @sirloinbh shared packages

env:
  NODE_AUTH_TOKEN: ${{ github.token }}
  # inputs are never put into the run shell directly, only used as environment variables (prevents script injection).
  NPM_VERSION: 11.19.0
  DATABASE_URL: postgres://app:test@localhost:5432/workout_test
  TEST_DATABASE_URL: postgres://app:test@localhost:5432/workout_test
  E2E_DATABASE_URL: postgres://app:test@localhost:5432/workout_test

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: test, POSTGRES_DB: 'workout_test' }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Supply chain check (before install, based on lockfile)
        run: node .standards/ioc-scan.mjs
      - name: Secret leak check (committed tokens and keys, .env)
        run: node .standards/secret-scan.mjs
      - run: npm install --global "npm@$NPM_VERSION" --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Central standards check
        run: node .standards/check.mjs
      - name: Supply chain check (after install, including node_modules)
        run: node .standards/ioc-scan.mjs
      - name: DB migration
        # Rule: docs/conventions/database.md (#27). The e2e job has the same script (a test checks they match).
        # 1) Like Docker init on an empty volume, apply all files once with psql without recording (checks they are safe to run again).
        # 2) If the shared runner (db:migrate) exists, apply again and record in schema_migrations.
        #    Apps without a runner yet apply once more with psql and only get a warning (compatible with the old behavior).
        run: |
          shopt -s nullglob
          for migration in database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1
          done
          if node -e "process.exit(require('./package.json').scripts?.['db:migrate'] ? 0 : 1)"; then
            npm run db:migrate
          else
            echo "::warning title=DB migration::There is no db:migrate runner, so migrations were applied with psql only. No applied-migration record is kept. Add a runner following the central docs/conventions/database.md."
            for migration in database/migrations/*.sql; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1
            done
          fi
      - run: npm run check
      - name: Unused files, exports, and dependencies (knip, warning only)
        # It does not fail at first (#263). Apps whose result reached 0 use the failing step via features.knipStrict (#342).
        if: hashFiles('knip.json') != '' && !false
        run: npm run knip || echo "::warning title=knip::There are unused files, exports, or dependencies. Check this step's log."
      - name: Unused files, exports, and dependencies (knip)
        if: hashFiles('knip.json') != '' && false
        run: npm run knip
      - name: Accessibility and performance scores (Lighthouse CI, warning only)
        # Only apps with registry features.lighthouse receive lighthouserc.json (#280). It serves the frontend/dist built by npm run check
        # statically and measures it with the runner's Google Chrome. Neither a missed threshold nor a failed measurement stops CI.
        id: lighthouse
        if: hashFiles('lighthouserc.json') != ''
        run: |
          node_modules/.bin/lhci autorun || echo "::warning title=Lighthouse CI::Measuring or checking the threshold scores failed. Check this step's log."
          # The score summary goes to node on standard input, so no shell quoting is involved.
          node - <<'JS'
          const fs = require('node:fs');
          const file = '.lighthouseci/manifest.json';
          if (!fs.existsSync(file)) process.exit(0);
          for (const run of JSON.parse(fs.readFileSync(file, 'utf8')).filter((r) => r.isRepresentativeRun)) {
            const scores = Object.entries(run.summary).map(([k, v]) => `${k} ${Math.round(v * 100)}`).join(', ');
            console.log(`${run.url}: ${scores}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Lighthouse ${run.url}: ${scores}\n`);
          }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.lighthouse.outcome != 'skipped'
        with: { name: lighthouse-report, path: .lighthouseci, retention-days: 7, if-no-files-found: ignore }
      - name: Deploy script syntax check
        run: |
          shopt -s nullglob
          for f in deploy/*.sh; do bash -n "$f" || exit 1; done

  e2e:
    if: true && !true
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: test, POSTGRES_DB: 'workout_test' }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global "npm@$NPM_VERSION" --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: DB migration
        # Same script as the step with the same name in the verify job.
        run: |
          shopt -s nullglob
          for migration in database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1
          done
          if node -e "process.exit(require('./package.json').scripts?.['db:migrate'] ? 0 : 1)"; then
            npm run db:migrate
          else
            echo "::warning title=DB migration::There is no db:migrate runner, so migrations were applied with psql only. No applied-migration record is kept. Add a runner following the central docs/conventions/database.md."
            for migration in database/migrations/*.sql; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration" || exit 1
            done
          fi
      # Playwright uses the Google Chrome installed on the runner image (ubuntu-24.04) as channel 'chrome'.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  # Screenshot comparison: compare against baseline images only in a container with fixed fonts and Chromium.
  e2e-visual:
    if: true && true
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: test, POSTGRES_DB: 'workout_test' }
        options: --health-cmd "pg_isready -h 127.0.0.1 -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      E2E_VISUAL: '1'
      # Inside the container, connect to the DB by service name.
      DATABASE_URL: postgres://app:test@postgres:5432/workout_test
      TEST_DATABASE_URL: postgres://app:test@postgres:5432/workout_test
      E2E_DATABASE_URL: postgres://app:test@postgres:5432/workout_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global "npm@$NPM_VERSION" --ignore-scripts
      - run: npm ci --ignore-scripts
      # The Playwright image has no psql. The verify job checks with psql that running again is safe.
      - name: DB migration
        run: npm run db:migrate
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # Candidate baseline images for screens that are missing or intentionally changed. After checking the differences in playwright-report,
      # commit this artifact to e2e/__screenshots__.
      - if: failure()
        run: npx playwright test --update-snapshots=changed --retries=0 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: visual-baselines, path: e2e/__screenshots__, retention-days: 7 }

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The package auth token is passed only as a BuildKit secret. It does not stay in image layers.
      - run: docker build --secret id=npm_token,env=NODE_AUTH_TOKEN ./frontend
      - run: docker build --secret id=npm_token,env=NODE_AUTH_TOKEN ./backend
