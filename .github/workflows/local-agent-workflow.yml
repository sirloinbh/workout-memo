name: Local agent workflow
on: [push, pull_request]
jobs:
  agent-workflow:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: node --test scripts/test/agent-workflow.test.mjs scripts/test/agent-runtime.test.mjs scripts/test/agent-models.test.mjs scripts/test/agent-review-regressions.test.mjs scripts/test/agent-conversation-cli.test.mjs
