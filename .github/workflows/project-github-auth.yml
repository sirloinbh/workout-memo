name: Project GitHub authentication
on: [push, pull_request]
jobs:
  windows-auth:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: node --test scripts/test/project-github-auth.test.mjs
