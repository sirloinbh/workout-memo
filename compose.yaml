services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workout}
      POSTGRES_USER: ${POSTGRES_USER:-workout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:${DB_PORT:-15401}:5432']
    volumes:
      - workout-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    # The package token reaches npm ci only as a BuildKit secret, never as a build arg or image layer.
    build: { context: ./backend, secrets: [npm_token] }
    # Tagged by commit on the server so the previous version can be restarted (#73).
    image: workout-backend:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-workout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-workout}
      PORT: 3101
      TZ: Asia/Seoul
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  web:
    build: { context: ./frontend, secrets: [npm_token] }
    image: workout-frontend:${IMAGE_TAG:-local}
    # Local default stays 127.0.0.1:8101; the server sets WEB_BIND/WEB_PORT in .env.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8101}:80']
    depends_on: [api]
    restart: unless-stopped
volumes:
  workout-data:
# NODE_AUTH_TOKEN (read:packages) comes from the environment or .env; see docs/deployment.md.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
