services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workout}
      POSTGRES_USER: ${POSTGRES_USER:-workout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:${DB_PORT:-15401}:5432']
    volumes:
      - workout-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: backend/Dockerfile, secrets: [npm_token] }
    # Tagged by commit on the server so the previous version can be restarted (#73).
    image: workout-backend:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-workout}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-workout}
      PORT: 3101
      TZ: Asia/Seoul
      # #303: the shared sign-in (sirloinbh/shared-auth) checks each /api session on its network.
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://shared-auth-api:3110}
      # #260: rest-end Web Push. Empty keys turn it off; the in-screen timer is not affected.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # #346: shared-ai's public key; set, the API serves its AI tools at /internal/tools (#334).
      AI_TOOLS_PUBLIC_KEY: ${AI_TOOLS_PUBLIC_KEY:-}
    networks:
      default: {}
      shared-auth: {}
      # shared-ai reads and calls the tools at http://workout-memo-api:3101 (project-standards#611).
      shared-ai: { aliases: [workout-memo-api] }
    depends_on:
      db: { condition: service_healthy }
    # The image has no curl, so node asks the API itself. `docker compose up -d --wait` and web's depends_on use it.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3101/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: frontend/Dockerfile, secrets: [npm_token] }
    image: workout-frontend:${IMAGE_TAG:-local}
    # Local default stays 127.0.0.1:8101; the server sets WEB_BIND/WEB_PORT in .env.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8101}:80']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  workout-data:
# Created by the shared-auth compose project. Locally, run shared-auth first, or once: docker network create shared-auth
networks:
  shared-auth:
    external: true
  # External so this app and shared-ai deploy in either order; deploy/remote-deploy.sh creates it when missing.
  # Locally, once: docker network create shared-ai
  shared-ai:
    name: shared-ai
    external: true
# The Dockerfiles read the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
